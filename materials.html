
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malzeme Veritabanı - İHA Tasarım Aracı</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #0d6efd;
            --light-gray: #f8f9fa;
            --gray-border: #dee2e6;
            --text-dark: #212529;
            --text-light: #6c757d;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; margin: 0; background-color: var(--light-gray); }
        .sidebar { width: 250px; background: #ffffff; border-right: 1px solid var(--gray-border); padding: 20px; height: 100vh; position: fixed; overflow-y: auto; }
        .main-content { margin-left: 270px; flex-grow: 1; padding: 20px; }
        .container { display: flex; gap: 30px; }
        .properties-panel { flex: 1; }
        .diagram-panel { flex: 2; }
        .section { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .section h3 { margin-top: 0; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid var(--gray-border); padding: 12px; text-align: left; }
        th { background-color: var(--light-gray); width: 50%; }
        select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--gray-border); }
        canvas { border: 1px solid var(--gray-border); background: #fff; }
        .sidebar-nav a { display: block; padding: 10px; color: var(--text-dark); text-decoration: none; border-radius: 5px; margin-bottom: 5px; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background-color: var(--primary-color); color: #fff; }
        h1 { color: var(--text-dark); }
        .sidebar-divider {
            height: 1px;
            background-color: var(--gray-border);
            margin: 15px 0;
        }
        .sidebar-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--gray-border);
            border-radius: 5px;
            background-color: #fff;
            color: var(--text-dark);
            cursor: pointer;
            text-align: left;
            font-size: 15px;
        }
        .sidebar-btn:hover {
            background-color: var(--light-gray);
        }
        .sidebar-btn.save { border-left: 3px solid #198754; }
        .sidebar-btn.load { border-left: 3px solid #0d6efd; }
        .sidebar-btn.clear { border-left: 3px solid #dc3545; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Navigasyon</h3>
        <nav class="sidebar-nav">
            <a href="index.html">Hesaplayıcı</a>
            <a href="geometry.html">Geometri Görselleştirici</a>
            <a href="analysis.html">Analiz Paneli</a>
            <a href="materials.html" class="active">Malzemeler</a>
            <a href="airfoil.html">Airfoil Analizi</a>
        </nav>

        <div class="sidebar-divider"></div>

        <h3>Proje</h3>
        <button id="save-button" class="sidebar-btn save">Projeyi Kaydet</button>
        <button id="load-button" class="sidebar-btn load">Projeyi Yükle</button>
        <button id="clear-button" class="sidebar-btn clear">Verileri Temizle</button>
    </div>

    <div class="main-content">
        <h1>Malzeme Veritabanı ve Analizi</h1>
        <p>Tasarımınız için kullanmak istediğiniz malzemenin mekanik özelliklerini ve davranışını inceleyin.</p>

        <div class="container">
            <div class="properties-panel">
                <div class="section">
                    <h3>Malzeme Seçimi</h3>
                    <select id="material-select">
                        <!-- Malzemeler buraya JS ile yüklenecek -->
                    </select>
                </div>
                <div class="section">
                    <h3>Mekanik Özellikler</h3>
                    <table id="properties-table">
                        <tbody>
                            <!-- Özellikler buraya JS ile yüklenecek -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="diagram-panel section">
                <h3>Gerilme-Gerinim Diyagramı</h3>
                <div class="chart-container" style="position: relative; height:500px; width:100%">
                    <canvas id="stressStrainChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const materialsDB = {
            'al6061': {
                name: 'Alüminyum 6061-T6',
                properties: { 'Yoğunluk (g/cm³)': 2.7, 'Elastisite Modülü (GPa)': 68.9, 'Poisson Oranı': 0.33, 'Akma Dayanımı (MPa)': 276, 'Çekme Dayanımı (MPa)': 310, 'Kopma Uzaması (%)': 17 }
            },
            'carbon_fiber': {
                name: 'Karbon Fiber (Standart Modül)',
                properties: { 'Yoğunluk (g/cm³)': 1.8, 'Elastisite Modülü (GPa)': 230, 'Poisson Oranı': 0.28, 'Akma Dayanımı (MPa)': 'Yok (Gevrek)', 'Çekme Dayanımı (MPa)': 4000, 'Kopma Uzaması (%)': 1.5 }
            },
            'balsa': {
                name: 'Balsa Ağacı',
                properties: { 'Yoğunluk (g/cm³)': 0.16, 'Elastisite Modülü (GPa)': 3.8, 'Poisson Oranı': 0.23, 'Akma Dayanımı (MPa)': 'Yok (Gevrek)', 'Çekme Dayanımı (MPa)': 15, 'Kopma Uzaması (%)': 1.2 }
            },
            'epp': {
                name: 'EPP Köpük',
                properties: { 'Yoğunluk (g/cm³)': 0.06, 'Elastisite Modülü (GPa)': 0.02, 'Poisson Oranı': 0.1, 'Akma Dayanımı (MPa)': 0.3, 'Çekme Dayanımı (MPa)': 0.5, 'Kopma Uzaması (%)': 15 }
            },
            'plywood': {
                name: 'Havacılık Kontrplağı',
                properties: { 'Yoğunluk (g/cm³)': 0.7, 'Elastisite Modülü (GPa)': 7.5, 'Poisson Oranı': 0.07, 'Akma Dayanımı (MPa)': 'Yok (Gevrek)', 'Çekme Dayanımı (MPa)': 40, 'Kopma Uzaması (%)': 0.8 }
            },
            'fiberglass': {
                name: 'Fiberglas (E-Glass)',
                properties: { 'Yoğunluk (g/cm³)': 2.55, 'Elastisite Modülü (GPa)': 72, 'Poisson Oranı': 0.22, 'Akma Dayanımı (MPa)': 'Yok (Gevrek)', 'Çekme Dayanımı (MPa)': 1500, 'Kopma Uzaması (%)': 2.5 }
            },
            'pla': {
                name: 'PLA (3D Baskı)',
                properties: { 'Yoğunluk (g/cm³)': 1.24, 'Elastisite Modülü (GPa)': 3.5, 'Poisson Oranı': 0.36, 'Akma Dayanımı (MPa)': 50, 'Çekme Dayanımı (MPa)': 55, 'Kopma Uzaması (%)': 6 }
            },
            'abs': {
                name: 'ABS (3D Baskı)',
                properties: { 'Yoğunluk (g/cm³)': 1.05, 'Elastisite Modülü (GPa)': 2.2, 'Poisson Oranı': 0.35, 'Akma Dayanımı (MPa)': 40, 'Çekme Dayanımı (MPa)': 45, 'Kopma Uzaması (%)': 20 }
            },
            'petg': {
                name: 'PETG (3D Baskı)',
                properties: { 'Yoğunluk (g/cm³)': 1.27, 'Elastisite Modülü (GPa)': 2.1, 'Poisson Oranı': 0.37, 'Akma Dayanımı (MPa)': 45, 'Çekme Dayanımı (MPa)': 50, 'Kopma Uzaması (%)': 25 }
            },
            'tpu': {
                name: 'TPU (Esnek Filament)',
                properties: { 'Yoğunluk (g/cm³)': 1.2, 'Elastisite Modülü (GPa)': 0.05, 'Poisson Oranı': 0.49, 'Akma Dayanımı (MPa)': 10, 'Çekme Dayanımı (MPa)': 30, 'Kopma Uzaması (%)': 600 }
            },
            'nylon': {
                name: 'Naylon PA12 (3D Baskı)',
                properties: { 'Yoğunluk (g/cm³)': 1.01, 'Elastisite Modülü (GPa)': 1.8, 'Poisson Oranı': 0.4, 'Akma Dayanımı (MPa)': 45, 'Çekme Dayanımı (MPa)': 50, 'Kopma Uzaması (%)': 150 }
            },
            'pccf': {
                name: 'PC-CF (Karbon Fiber Polikarbonat)',
                properties: { 'Yoğunluk (g/cm³)': 1.3, 'Elastisite Modülü (GPa)': 8.0, 'Poisson Oranı': 0.3, 'Akma Dayanımı (MPa)': 'Yok (Gevrek)', 'Çekme Dayanımı (MPa)': 90, 'Kopma Uzaması (%)': 2.5 }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('material-select');

            // Populate select menu
            for (const key in materialsDB) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = materialsDB[key].name;
                select.appendChild(option);
            }

            // Initial load and event listener
            select.addEventListener('change', updateMaterialInfo);
            updateMaterialInfo(); // Load data and draw chart for the default selected material
        });

        let stressStrainChart = null;

        function updateMaterialInfo() {
            const selectedKey = document.getElementById('material-select').value;
            const material = materialsDB[selectedKey];
            const tableBody = document.querySelector('#properties-table tbody');

            // Update properties table
            tableBody.innerHTML = '';
            for (const [prop, value] of Object.entries(material.properties)) {
                const row = document.createElement('tr');
                row.innerHTML = `<th>${prop}</th><td>${value}</td>`;
                tableBody.appendChild(row);
            }

            // Draw the stress-strain diagram
            drawStressStrainDiagram(material);
        }

        function drawStressStrainDiagram(material) {
            const ctx = document.getElementById('stressStrainChart').getContext('2d');

            const props = material.properties;
            const youngsModulus = props['Elastisite Modülü (GPa)'] * 1000; // to MPa
            const yieldStrength = parseFloat(props['Akma Dayanımı (MPa)']);
            const ultimateStrength = props['Çekme Dayanımı (MPa)'];
            const elongation = props['Kopma Uzaması (%)'] / 100;

            const labels = [];
            const data = [];

            // Simplified curve generation
            const yieldStrain = isNaN(yieldStrength) ? (ultimateStrength / youngsModulus) * 0.8 : yieldStrength / youngsModulus;
            const ultimateStrain = elongation;

            // Elastic region
            labels.push(0);
            data.push(0);

            if (!isNaN(yieldStrength)) {
                labels.push(yieldStrain.toFixed(4));
                data.push(yieldStrength);
            }

            // Plastic/Ultimate region
            labels.push(ultimateStrain.toFixed(4));
            data.push(ultimateStrength);

            // Resilience (area under elastic part)
            const resilience = 0.5 * yieldStrength * yieldStrain;
            // Toughness (approximate area under the whole curve)
            const toughness = isNaN(yieldStrength) ? 0.5 * ultimateStrength * ultimateStrain :
                resilience + (yieldStrength + ultimateStrength) / 2 * (ultimateStrain - yieldStrain);

            if (stressStrainChart) {
                stressStrainChart.destroy();
            }

            stressStrainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.sort(),
                    datasets: [{
                        label: 'Gerilme (MPa)',
                        data: data,
                        borderColor: '#0d6efd',
                        tension: 0.2,
                        fill: true,
                        backgroundColor: 'rgba(13, 110, 253, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: `${material.name} - Gerilme-Gerinim Diyagramı` },
                        subtitle: {
                            display: true,
                            text: `Tokluk: ~${toughness.toFixed(2)} MJ/m³ | Rezilyans: ~${isNaN(resilience) ? 'N/A' : resilience.toFixed(2)} MJ/m³ | Süneklik: ${elongation * 100}%`,
                            padding: { bottom: 10 }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Gerinim (Birim Değiştirme - m/m)' } },
                        y: { title: { display: true, text: 'Gerilme (MPa)' }, beginAtZero: true }
                    }
                }
            });
        }

        // --- PROJECT SAVE/LOAD LOGIC ---
        document.getElementById('save-button').addEventListener('click', saveProjectData);
        document.getElementById('load-button').addEventListener('click', loadProjectData);
        document.getElementById('clear-button').addEventListener('click', clearProjectData);

        function clearProjectData() {
            if (confirm('Kaydedilmiş tüm proje verilerini silmek istediğinizden emin misiniz? Bu işlem geri alınamaz.')) {
                localStorage.removeItem('uavProjectData');
                alert('Proje verileri başarıyla silindi.');
                location.reload();
            }
        }

        function loadProjectData() {
            const projectDataString = localStorage.getItem('uavProjectData');
            if (!projectDataString) {
                alert('Kaydedilmiş proje verisi bulunamadı.');
                return;
            }

            try {
                const projectData = JSON.parse(projectDataString);
                if (projectData.materials && projectData.materials.selectedMaterial) {
                    const selectElement = document.getElementById('material-select');
                    selectElement.value = projectData.materials.selectedMaterial;

                    // Değişikliğin UI'da yansıtılması için güncelleme fonksiyonunu tetikle
                    updateMaterialInfo();

                    alert('Proje başarıyla yüklendi!');
                } else {
                    alert('Bu sayfa için kaydedilmiş malzeme verisi bulunamadı.');
                }
            } catch (e) {
                console.error("Proje yüklenirken hata oluştu:", e);
                alert('Proje yüklenirken bir hata oluştu. Lütfen konsolu kontrol edin.');
            }
        }

        function saveProjectData() {
            // Mevcut proje verilerini yüklemeyi dene, yoksa yeni bir nesne oluştur
            let projectData = {};
            try {
                const existingData = localStorage.getItem('uavProjectData');
                if (existingData) {
                    projectData = JSON.parse(existingData);
                }
            } catch (e) {
                console.error("Mevcut proje verileri okunurken hata oluştu:", e);
                projectData = {}; // Hata durumunda sıfırla
            }

            // Malzeme seçimini kaydet
            projectData.materials = {
                selectedMaterial: document.getElementById('material-select').value
            };

            try {
                localStorage.setItem('uavProjectData', JSON.stringify(projectData));
                alert('Proje başarıyla kaydedildi!');
            } catch (e) {
                console.error("Projeyi kaydederken hata oluştu:", e);
                alert('Proje kaydedilirken bir hata oluştu. Lütfen konsolu kontrol edin.');
            }
        }

    </script>
</body>
</html>
